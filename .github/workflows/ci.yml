name: Harness CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "config/**"
      - "examples/**"
      - "fcv_harness/**"
      - "pyproject.toml"
      - "tests_*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "config/**"
      - "examples/**"
      - "fcv_harness/**"
      - "pyproject.toml"
      - "tests_*.py"

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracted-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compile package
        run: python -m compileall -q fcv_harness

      - name: Run active synthetic acceptance tests
        run: |
          python tests_smoke.py
          python tests_canonical.py
          python tests_country_identity.py
          python tests_empirical_input.py
          python tests_measurement_projection.py
          python tests_contracted_acled_e1_e2.py

      - name: Verify active configs do not name the legacy ACLED aggregate
        run: |
          if grep -R "agg_acled_africa" config/canonical_a2_T2_y2001.json config/analysis_surface_a2_T2_y2001.json config/resolved_wbad_record_acled_vac.json; then
            echo "active experiment config still references the legacy ACLED aggregate" >&2
            exit 1
          fi

      - name: Verify active projection code does not reconstruct raw ACLED fields
        run: |
          if grep -E "FATALITIES|EVENT_TYPE|GEO_PRECISION" fcv_harness/measurement_projection.py fcv_harness/contracted_surface.py fcv_harness/contracted_experiment.py fcv_harness/contracted_calibration.py; then
            echo "active contracted projection code contains raw ACLED ingestion field names" >&2
            exit 1
          fi
