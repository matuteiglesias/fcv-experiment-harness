name: Harness CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "config/**"
      - "examples/**"
      - "fcv_harness/**"
      - "pyproject.toml"
      - "tests_*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "config/**"
      - "examples/**"
      - "fcv_harness/**"
      - "pyproject.toml"
      - "tests_*.py"

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracted-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compile package
        run: python -m compileall -q fcv_harness

      - name: Run active synthetic acceptance tests
        run: |
          python tests_smoke.py
          python tests_canonical.py
          python tests_country_identity.py
          python tests_empirical_input.py
          python tests_measurement_projection.py
          python tests_contracted_acled_e1_e2.py
          python tests_fully_contracted_investment.py
          python tests_fully_contracted_calibration.py
          python tests_calibration_lab.py
          python tests_observability.py
          python tests_reference_identity.py
          python tests_inference_calibration.py
          python tests_current_e2_reference.py
          python tests_current_e2_scope.py
          python tests_current_e2_robustness.py
          python tests_current_e2_inference.py
          python tests_current_e2_influence.py
          python tests_current_e2_falsification.py
          python tests_current_e2_sparse_outcomes.py
          python tests_briggs_lane_b.py

      - name: Verify active configs do not name the legacy ACLED aggregate
        run: |
          if grep -R "agg_acled_africa" config/canonical_a2_T2_y2001.json config/analysis_surface_a2_T2_y2001.json config/resolved_wbad_record_acled_vac.json config/current_geogcdf_acled_e2.json config/current_geogcdf_acled_e2_robustness.json config/current_e2_inference_calibration.json config/current_e2_influence_stability.json config/current_e2_falsification_battery.json config/current_e2_sparse_outcome_family.json; then
            echo "active experiment config still references the legacy ACLED aggregate" >&2
            exit 1
          fi

      - name: Verify current E2 configs have no legacy treatment vocabulary
        run: |
          if grep -E "jobcat|legacy_2023|wbad|wbkg|cn_record_present|cn_amount_positive" config/current_geogcdf_acled_e2.json config/current_geogcdf_acled_e2_robustness.json config/current_e2_reference_lock.json config/current_e2_inference_calibration.json config/current_e2_influence_stability.json config/current_e2_falsification_battery.json config/current_e2_sparse_outcome_family.json; then
            echo "current E2 reference/robustness/inference/influence/falsification/sparse-outcome config contains legacy project-treatment semantics" >&2
            exit 1
          fi

      - name: Verify active projection code does not reconstruct raw ACLED fields
        run: |
          if grep -E "FATALITIES|EVENT_TYPE|GEO_PRECISION" fcv_harness/measurement_projection.py fcv_harness/contracted_surface.py fcv_harness/contracted_experiment.py fcv_harness/contracted_calibration.py fcv_harness/fully_contracted_experiment.py fcv_harness/fully_contracted_calibration.py fcv_harness/current_e2_reference.py fcv_harness/current_e2_scope.py fcv_harness/current_e2_robustness.py fcv_harness/current_e2_inference.py fcv_harness/current_e2_influence.py fcv_harness/current_e2_falsification.py fcv_harness/current_e2_sparse_outcomes.py; then
            echo "active contracted projection code contains raw ACLED ingestion field names" >&2
            exit 1
          fi

      - name: Verify fully contracted investment path has no legacy treatment semantics
        run: |
          if grep -E "jobcat|cn_record_present|cn_amount_positive|wbad_record_present|wbkg_record_present|legacy_2023" fcv_harness/fully_contracted_experiment.py fcv_harness/fully_contracted_calibration.py fcv_harness/current_e2_reference.py fcv_harness/current_e2_scope.py fcv_harness/current_e2_robustness.py fcv_harness/current_e2_inference.py fcv_harness/current_e2_influence.py fcv_harness/current_e2_falsification.py fcv_harness/current_e2_sparse_outcomes.py; then
            echo "fully contracted investment path contains legacy project-treatment semantics" >&2
            exit 1
          fi
