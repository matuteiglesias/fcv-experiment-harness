[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcv-experiment-harness"
version = "0.1.0"
description = "Experimental measurement harness for FCV spatial-data research"
requires-python = ">=3.10"
dependencies = [
  "empirical-data-contracts>=0.1,<0.2",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15,<23",
  "statsmodels>=0.14"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fcv_harness*"]
